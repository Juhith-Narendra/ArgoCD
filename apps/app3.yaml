apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: app3
  namespace: argocd
spec: 
  destination:
    namespace: argocd-juhith
    server: "https://kubernetes.default.svc"
  project: alpha
  source: 
    path: helm-guestbook
    repoURL: "https://github.com/mabusaa/argocd-example-apps.git"
    targetRevision: master
    helm:
      valueFiles:
        - values.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true