apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: app1
  namespace: argocd
spec: 
  destination: 
    namespace: argocd-juhith
    server: "https://kubernetes.default.svc"
  project: alpha
  source: 
    path: guestbook
    repoURL: "https://github.com/Juhith-Narendra/ArgoCD.git"
    targetRevision: master
  syncPolicy:
    syncOptions:
      - CreateNamespace=true